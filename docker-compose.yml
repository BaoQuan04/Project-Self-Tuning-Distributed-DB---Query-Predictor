version: '3.8'

services:
  site_a_db:
    image: postgres:15
    container_name: site_a_postgres
    environment:
      POSTGRES_DB: site_a
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5435:5432"
    volumes:
      - site_a_data:/var/lib/postgresql/data
      - ./data/schema_site_a.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_a"]
      interval: 10s
      timeout: 5s
      retries: 5

  site_b_db:
    image: postgres:15
    container_name: site_b_postgres
    environment:
      POSTGRES_DB: site_b
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - site_b_data:/var/lib/postgresql/data
      - ./data/schema_site_b.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_b"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cache_redis
    ports:
      - "6379:6379"
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  site_a_data:
  site_b_data:

networks:
  db_network:
    driver: bridge
